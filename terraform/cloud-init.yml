#cloud-config
# ──────────────────────────────────────────────────────────────
# OpenClaw Agent Launcher — Cloud-Init (REFERENCE ONLY)
#
# NOTE: The actual cloud-init is generated dynamically by
# provisioner/src/deployer.ts:generateCloudInit().
# This file is kept for documentation and manual debugging.
# ──────────────────────────────────────────────────────────────

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - jq
  - unzip

write_files:
  - path: /opt/openclaw/setup.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      export DEBIAN_FRONTEND=noninteractive
      DEPLOY_ID="${deploy_id}"
      DB_PASSWORD="${db_password}"
      ENCRYPTION_KEY="${encryption_key}"
      TAILSCALE_AUTH_KEY="${tailscale_auth_key}"
      AGENT_COUNT="${agent_count}"

      echo "[openclaw] Starting setup for deploy $DEPLOY_ID"

      # ── Install Docker ─────────────────────────────────────
      echo "[openclaw] Installing Docker..."
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
        gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      chmod a+r /etc/apt/keyrings/docker.gpg

      echo \
        "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
        https://download.docker.com/linux/ubuntu \
        $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
        tee /etc/apt/sources.list.d/docker.list > /dev/null

      apt-get update -qq
      apt-get install -y -qq docker-ce docker-ce-cli containerd.io \
        docker-buildx-plugin docker-compose-plugin

      systemctl enable --now docker

      # ── Install Tailscale ──────────────────────────────────
      echo "[openclaw] Installing Tailscale..."
      curl -fsSL https://tailscale.com/install.sh | sh
      tailscale up --authkey="$TAILSCALE_AUTH_KEY" --hostname="openclaw-server"

      # Wait for Tailscale IP
      for i in $(seq 1 30); do
        TS_IP=$(tailscale ip -4 2>/dev/null || true)
        if [ -n "$TS_IP" ]; then
          echo "[openclaw] Tailscale IP: $TS_IP"
          break
        fi
        sleep 2
      done

      # ── Deploy Stack ───────────────────────────────────────
      echo "[openclaw] Deploying agent stack..."
      mkdir -p /opt/openclaw/stack
      cd /opt/openclaw/stack

      # docker-compose.yml and stack files are uploaded by the provisioner
      # via SCP/rsync after cloud-init completes basic setup

      # Write environment file
      umask 077
      cat > /opt/openclaw/runtime-secrets.env <<ENVEOF
      DEPLOY_ID=$DEPLOY_ID
      DB_PASSWORD=$DB_PASSWORD
      ENCRYPTION_KEY=$ENCRYPTION_KEY
      AGENT_SERVICE_TOKEN=$ENCRYPTION_KEY
      SUPABASE_JWT_SECRET=$ENCRYPTION_KEY
      TAILSCALE_IP=$TS_IP
      AGENT_COUNT=$AGENT_COUNT
      ENVEOF
      chmod 600 /opt/openclaw/runtime-secrets.env

      # Signal readiness
      echo "[openclaw] Cloud-init complete, waiting for stack deployment"
      touch /opt/openclaw/.cloud-init-done

  - path: /opt/openclaw/deploy-stack.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      cd /opt/openclaw/stack
      set -a
      source /opt/openclaw/runtime-secrets.env
      set +a
      : "${DEPLOY_ID:?DEPLOY_ID is required}"
      : "${DB_PASSWORD:?DB_PASSWORD is required}"
      : "${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}"
      : "${AGENT_SERVICE_TOKEN:?AGENT_SERVICE_TOKEN is required}"
      : "${AGENT_COUNT:?AGENT_COUNT is required}"

      echo "[openclaw] Starting Docker Compose stack..."
      docker compose up -d --build

      echo "[openclaw] Stack deployment complete"
      touch /opt/openclaw/.stack-ready

  - path: /opt/openclaw/health-check.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Returns 0 if all containers are healthy

      cd /opt/openclaw/stack
      UNHEALTHY=$(docker compose ps --format json | jq -r 'select(.Health != "healthy" and .State == "running") | .Name' 2>/dev/null | wc -l)

      if [ "$UNHEALTHY" -gt 0 ]; then
        echo "unhealthy"
        exit 1
      fi

      echo "healthy"
      exit 0

runcmd:
  - /opt/openclaw/setup.sh
