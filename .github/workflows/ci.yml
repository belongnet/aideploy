# Credential-free CI. Fork pull requests can reach no secrets.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  history-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned
        with:
          fetch-depth: 0
      - run: ./scripts/verify-public-history.sh
      - run: ./scripts/test-public-history-contract.sh

  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, pinned
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
        working-directory: cli
      - run: npm run lint
        working-directory: cli
      - run: npm test
        working-directory: cli
      - run: npm run test:version
        working-directory: cli
      - run: npm run test:package
        working-directory: cli
      - name: Test the zero-secret command builder
        if: matrix.os == 'ubuntu-latest'
        run: npm --prefix web test

  dashboard:
    name: dashboard (${{ matrix.package }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [dashboard, master-dashboard]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, pinned
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stack/${{ matrix.package }}/package-lock.json
      - run: npm ci
        working-directory: stack/${{ matrix.package }}
      - run: npm audit --audit-level=high
        working-directory: stack/${{ matrix.package }}
      - run: npm run lint
        working-directory: stack/${{ matrix.package }}
      - run: npm test
        working-directory: stack/${{ matrix.package }}
      - run: npm run build
        working-directory: stack/${{ matrix.package }}

  agent-reference:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned
      - name: Build the shipped Python agent image
        run: docker build --tag aideploy-agent-reference:ci stack/agent
      - name: Run the agent unit tests in the shipped image
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/stack/agent/tests:/app/tests:ro" \
            aideploy-agent-reference:ci \
            -W error::DeprecationWarning \
            -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify the installed dependency graph
        run: |
          docker run --rm --entrypoint python \
            aideploy-agent-reference:ci \
            -m pip check
          docker run --rm --entrypoint python \
            aideploy-agent-reference:ci \
            -c "import importlib.util; assert importlib.util.find_spec('cryptography') is None"

  tofu-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [digitalocean, aws, gcp, azure, self-host-digitalocean]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2, pinned
      - run: tofu fmt -check -recursive
        working-directory: terraform/${{ matrix.module }}
      - run: tofu init -backend=false -input=false && tofu validate -no-color
        working-directory: terraform/${{ matrix.module }}

  runtime-smoke:
    # OpenClaw boots its pinned image. Hermes checks the production installer
    # bytes, installs the checksum-pinned source archive, boots the real API
    # gateway, and polls /health without provider credentials.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime: [openclaw, hermes]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned
      - run: ./cli/scripts/runtime-smoke.sh ${{ matrix.runtime }}
        env:
          SMOKE_UP: '1'

  runtime-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned
      - run: ./cli/scripts/backup-smoke.sh
      - run: ./cli/scripts/tailscale-archive-smoke.sh
      - run: ./cli/scripts/bake-tofu-checksums.sh --check
      - run: ./scripts/test-create-base-release.sh

  workflow-and-shell-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned
      - name: shellcheck every shipped shell entry point
        run: find cli/scripts stack/runtime scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck -S warning
      - name: actionlint every public workflow
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.10@sha256:ef8299f97635c4c30e2298f48f30763ab782a4ad2c95b744649439a039421e36
