# This workflow is loaded from the protected base commit. It checks out and
# executes only base-owned guard code, then reads candidate Git objects as data.
# Fork pull requests receive no repository secrets.
name: publication-boundary
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: check out the exact protected base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: enumerate every changed path
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          BREAK_GLASS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'publication-guard-break-glass') }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name || '' }}
          ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -Eeuo pipefail
          files_json="$RUNNER_TEMP/publication-guard-pr-files.json"
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/files" >"$files_json"
          observed="$(python3 scripts/publication-guard/classify_pr_files.py count <"$files_json")"
          if [ "$observed" -ne "$EXPECTED_CHANGED_FILES" ]; then
            echo "::error::PR file enumeration was truncated; publication policy fails closed."
            exit 1
          fi
          policy_changed="$(python3 scripts/publication-guard/classify_pr_files.py policy <"$files_json")"
          if [ "$policy_changed" -eq 1 ] && [ "$BREAK_GLASS_LABEL" != true ]; then
            echo "::error::Publication guard files are base-owned. A maintainer must apply publication-guard-break-glass."
            exit 1
          fi
          if [ "$policy_changed" -eq 1 ]; then
            permission=none
            if [ "$EVENT_ACTION" = labeled ] && [ "$EVENT_LABEL" = publication-guard-break-glass ]; then
              permission="$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || true)"
            fi
            reviews_json="$RUNNER_TEMP/publication-guard-pr-reviews.json"
            gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" >"$reviews_json"
            independent_review=0
            while IFS= read -r reviewer; do
              [ -n "$reviewer" ] || continue
              reviewer_permission="$(gh api "repos/$GH_REPO/collaborators/$reviewer/permission" --jq .permission 2>/dev/null || true)"
              if python3 scripts/publication-guard/verify-break-glass-event.py \
                publication-guard-break-glass "$HEAD_SHA" "$EVENT_ACTION" "$EVENT_LABEL" \
                "$ACTOR" "$PR_AUTHOR" "$permission" "$reviewer" "$reviewer_permission"; then
                independent_review=1
                break
              fi
            done < <(jq -r --arg head "$HEAD_SHA" '.[][] | select(.state == "APPROVED" and .commit_id == $head) | .user.login // empty' "$reviews_json")
            if [ "$independent_review" -ne 1 ]; then
              echo "::error::Break glass requires a second write-capable maintainer approval on the exact PR head."
              exit 1
            fi
            echo "Maintainer-controlled label and independent review received for the exact PR head; the base-owned scan still runs."
          fi

      - name: fetch candidate objects without checking out pull-request code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          git fetch --no-tags --force origin \
            "+refs/pull/$PR_NUMBER/head:refs/aideploy-publication/head"
          fetched="$(git rev-parse 'refs/aideploy-publication/head^{commit}')"
          test "$fetched" = "$HEAD_SHA"

      - name: scan candidate Git objects with protected-base rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/publication-guard/scan.py \
            --repo . --base "$BASE_SHA" --head "$HEAD_SHA"
